version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    groups:
      spring-boot:
        patterns:
          - "org.springframework.boot*"
      not-spring-boot:
        patterns:
          - "*"
        exclude-patterns:
          - "org.springframework.boot*"
    ignore:
      - dependency-name: "org.springframework.boot:*"
        update-types: ["version-update:semver-major"]
